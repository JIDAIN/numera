name: Apply A home redesign

on:
  push:
    branches:
      - audit/a-v1-finalize-final

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/apply-a-home-redesign.py
      - run: npx --no-install prettier --write src/app/page.tsx src/app/globals.css src/lib/types.ts src/lib/a-training-plan.ts src/lib/a-training-plan.test.ts src/components/AHomeTraining.tsx src/components/AHomeTraining.test.tsx src/components/ClassicTrainingSelector.tsx
      - name: Commit applied redesign
        shell: bash
        run: |
          rm scripts/apply-a-home-redesign.py
          rm .github/workflows/apply-a-home-redesign.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: redesign A training home"
          git push
