name: C2 E2 source formatter

on:
  push:
    paths:
      - ".github/workflows/c2-e2-source-formatter.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier to source fixtures
        run: |
          npx --no-install prettier --write src/lib/c2/source-fixtures.test.ts src/lib/c2/fixtures/e2-source-cases.json docs/engineering/c2/e2-source-coverage-v1.md docs/engineering/c2/active-plan.md docs/engineering/c2/README.md docs/engineering/c2/e2-math-oracle-fixtures.md
          git add src/lib/c2/source-fixtures.test.ts src/lib/c2/fixtures/e2-source-cases.json docs/engineering/c2/e2-source-coverage-v1.md docs/engineering/c2/active-plan.md docs/engineering/c2/README.md docs/engineering/c2/e2-math-oracle-fixtures.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(c2): format source evidence fixtures and docs"
            git push
          fi
