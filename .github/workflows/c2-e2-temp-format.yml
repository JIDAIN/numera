name: C2 E2 temporary formatter

on:
  push:
    paths:
      - ".github/workflows/c2-e2-temp-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format E2 plan table
        run: |
          npx --no-install prettier --write docs/engineering/c2/active-plan.md
          git add docs/engineering/c2/active-plan.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(c2): format updated E2 status table"
            git push
          fi
