name: C2 Format Fix

on:
  push:
    branches:
      - c2-runtime-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2-runtime-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format C2 files
        run: |
          npx --no-install prettier --write \
            src/lib/c2/contract.ts \
            src/lib/c2/generator.ts \
            src/lib/c2/math.ts \
            src/lib/c2/route-direct.ts \
            src/lib/c2/route-evaluator.test.ts \
            src/lib/c2/route-evaluator.ts \
            src/lib/c2/route-scaling.ts \
            src/lib/c2/route-split.ts \
            src/lib/c2/support.test.ts \
            src/lib/c2/support.ts
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/c2
          git commit -m "style(c2): format runtime foundation"
          git push origin HEAD:c2-runtime-foundation
