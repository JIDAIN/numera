name: C2 preflight one-off format
on:
  push:
    branches:
      - c2-contract-preflight-20261010
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2-contract-preflight-20261010
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only C2 files changed by this preflight
        run: |
          npx --no-install prettier --write \
            src/lib/c2/contract.ts \
            src/lib/c2/contract.test.ts \
            src/lib/c2/runtime.ts \
            src/lib/c2/runtime.test.ts \
            docs/engineering/c2/active-plan.md \
            docs/engineering/c2/README.md \
            docs/engineering/c2-implementation-plan.md
      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/c2/contract.ts src/lib/c2/contract.test.ts src/lib/c2/runtime.ts src/lib/c2/runtime.test.ts docs/engineering/c2/active-plan.md docs/engineering/c2/README.md docs/engineering/c2-implementation-plan.md
          if ! git diff --cached --quiet; then
            git commit -m "style(c2): apply repository Prettier to preflight files"
            git push origin HEAD:c2-contract-preflight-20261010
          fi
