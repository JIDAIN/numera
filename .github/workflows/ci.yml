name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Print Prettier diff for documentation
        shell: bash
        run: |
          files=(
            .agents/skills/numera-maintainer/SKILL.md
            AGENTS.md
            PROJECT_STATUS.md
            README.md
            docs/adr/ADR-001-student-facing-training-units.md
          )
          npx --no-install prettier --write "${files[@]}"
          git diff -- "${files[@]}"
          exit 1
