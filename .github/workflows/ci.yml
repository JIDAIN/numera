name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Security remediation validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply minimal dependency remediation
        shell: bash
        run: |
          npm pkg set overrides.sharp=0.35.4
          npm install --save-dev --save-exact vitest@5.0.0
          npm audit fix

      - name: Verify all dependency advisories are cleared
        run: npm audit --audit-level=moderate

      - name: Verify production dependency advisories are cleared
        run: npm audit --omit=dev --audit-level=moderate

      - name: Check package formatting
        run: npx --no-install prettier --check package.json package-lock.json

      - name: Check types
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build

      - name: Commit validated dependency remediation
        if: github.event_name == 'push' && github.ref == 'refs/heads/security/npm-audit-issue-5'
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: remediate npm audit findings [skip ci]"
          git push origin HEAD:security/npm-audit-issue-5
