name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Phase 1 runtime foundation files
        shell: bash
        run: |
          files=(
            src/app/page.tsx
            src/components/HistoryList.tsx
            src/components/PKDetails.tsx
            src/components/PKPage.tsx
            src/components/SessionDetails.tsx
            src/lib/data-export-files.ts
            src/lib/data-export.ts
            src/lib/grader-registry.ts
            src/lib/pk.ts
            src/lib/runtime-foundation.test.ts
            src/lib/session.ts
            src/lib/storage.ts
            src/lib/training-definition.ts
            src/lib/training-renderer.ts
            src/lib/training-response.ts
            src/lib/training.ts
            src/lib/types.ts
            docs/architecture/README.md
            docs/architecture/training-runtime.md
            docs/domain/README.md
            docs/engineering/current-state.md
            docs/engineering/first-layer-plan.md
          )

          npx --no-install prettier --write "${files[@]}"
          if ! git diff --quiet -- "${files[@]}"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${files[@]}"
            git commit -m "style: format runtime foundation files"
            git push origin HEAD:master
          fi

      - name: Check types
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build
