name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting of changed files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base" "${{ github.sha }}" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' \
              '*.css' '*.scss' '*.md' '*.json' '*.yml' '*.yaml'
          )

          if (( ${#files[@]} == 0 )); then
            echo "No changed files require a formatting check."
            exit 0
          fi

          printf 'Formatting check targets:\n%s\n' "${files[*]}"
          npx --no-install prettier --write src/app/page.test.tsx
          git --no-pager diff -- src/app/page.test.tsx
          exit 1

      - name: Check types
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build