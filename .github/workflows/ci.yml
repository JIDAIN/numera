name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Phase 2 Formal A files
        shell: bash
        run: |
          files=(
            src/components/HistoryList.test.tsx
            src/lib/storage-v2.test.ts
            src/app/a-home-session.integration.test.tsx
            src/lib/canonical-a-generate.ts
            src/lib/canonical-a-generate.test.ts
            src/lib/a-ability-metadata.ts
            src/lib/a-abilities.ts
            src/lib/implemented-skill-drills.test.ts
            src/lib/skill-registry.ts
            src/lib/skill-registry.test.ts
            src/lib/a-training-plan.test.ts
            src/lib/mastery.ts
            src/lib/mastery.test.ts
            src/components/AHomeTraining.tsx
            src/components/AHomeTraining.test.tsx
            src/components/SkillInsights.tsx
            src/components/SkillInsights.test.tsx
            docs/domain/README.md
            docs/architecture/README.md
            docs/architecture/training-runtime.md
            docs/engineering/current-state.md
            docs/engineering/first-layer-plan.md
          )

          npx --no-install prettier --write "${files[@]}"
          if ! git diff --quiet -- "${files[@]}"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${files[@]}"
            git commit -m "style: format Formal A closure files"
            git push origin HEAD:master
          fi

      - name: Check types
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build
