name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format C4 implementation files
        shell: bash
        run: |
          files=(
            docs/engineering/first-layer-plan.md
            docs/engineering/current-state.md
            docs/architecture/training-runtime.md
            docs/domain/README.md
            docs/product/ui.md
            docs/product/README.md
            src/components/C4SessionInsights.test.tsx
            src/app/c4-session.integration.test.tsx
            src/app/page.tsx
            src/app/globals.css
            src/components/C4HomeTraining.tsx
            src/components/C4HomeTraining.test.tsx
            src/components/C4SessionInsights.tsx
            src/components/HistoryCharts.tsx
            src/components/HistoryCharts.test.tsx
            src/components/SessionDetails.tsx
            src/lib/c-project-registry.ts
            src/lib/c4-training.ts
            src/lib/c4-training.test.ts
            src/lib/session.ts
            src/lib/session.test.ts
            src/lib/statistics.ts
            src/lib/statistics.test.ts
            src/lib/training-definition.ts
          )

          npx --no-install prettier --write "${files[@]}"
          if ! git diff --quiet -- "${files[@]}"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${files[@]}"
            git commit -m "style: format C4 implementation files"
            git push origin HEAD:master
          fi

      - name: Check types
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build
