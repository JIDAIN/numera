name: Format A V1 audit

on:
  push:
    branches:
      - audit/a-v1-finalize-final
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format A V1 files
        run: npx --no-install prettier --write src/lib/canonical-a-generate.ts src/lib/canonical-a-generate.test.ts

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/canonical-a-generate.ts src/lib/canonical-a-generate.test.ts
          git commit -m "style: format A V1 finalization"
          git push
