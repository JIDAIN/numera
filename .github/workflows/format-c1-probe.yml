name: Format C1 Probe

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print Prettier-formatted C1 source
        run: |
          npx --no-install prettier --write src/lib/c1-training.ts
          echo '---FORMATTED-C1-BEGIN---'
          cat src/lib/c1-training.ts
          echo '---FORMATTED-C1-END---'
